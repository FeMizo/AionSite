name: Validate Published Blog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate blog catalog
        run: npm run blog:validate

      - name: Build static export
        run: npm run build:static
